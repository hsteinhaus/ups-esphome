# Everything in the UPS monitor that does not depend on the board: the USB host,
# the apc_ups component and every entity it exposes. Both board configs include
# this, so an entity added here cannot go missing from one of them.
#
# Fonts and the display lambda stay with each board, since they are sized to a
# particular panel.

logger:
  # Per-tag levels may only be quieter than the global one, so the global stays
  # VERBOSE (descriptor dumps need it) and the chatty tags are muted by name.
  level: VERBOSE
  logs:
    i2c.idf: ERROR
    spi_device: ERROR
    FT63X6: WARN
    touchscreen: WARN
    display.mipi_spi: WARN
    component: WARN
    sensor: WARN
    binary_sensor: WARN
    text_sensor: WARN
    uptime.sensor: WARN
    wifi_info: WARN
    api: WARN
    web_server: ERROR
    web_server_idf: ERROR
    mdns: WARN
    preferences: WARN
    wifi: INFO
    switch: INFO
    template.switch: INFO
    switch.gpio: INFO
    light: WARN
    axp2101: WARN
    apc_ups: DEBUG
  # The OTG peripheral owns the PHY, so there is no serial console to log to.
  baud_rate: 0

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      # The IDF USB host ISR is flash-resident with no IRAM option, so a
      # transfer completing during the erase makes its driver assert.
      - lambda: 'id(ups).suspend_usb();'
    on_error:
      - lambda: 'id(ups).resume_usb();'
  - platform: web_server
    on_begin:
      # The IDF USB host ISR is flash-resident with no IRAM option, so a
      # transfer completing during the erase makes its driver assert.
      - lambda: 'id(ups).suspend_usb();'
    on_error:
      - lambda: 'id(ups).resume_usb();'

web_server:
  port: 80
  version: 3
  local: true
  # Without these every entity lands in one "Sensor and control" list, mixing
  # the UPS's battery with the CoreS3's own.
  sorting_groups:
    - id: group_ups
      name: "UPS"
      sorting_weight: 10
    - id: group_board
      name: "CoreS3"
      sorting_weight: 20

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

external_components:
  - source:
      type: local
      path: components
    components: [apc_ups]

usb_host:
  # Transfer buffers are allocated at this size, and a control transfer's
  # payload is limited to it minus the 8-byte setup packet. The default 64
  # leaves 56 bytes, far short of a HID report descriptor, which must arrive in
  # a single transfer because GET_DESCRIPTOR has no offset parameter.
  max_packet_size: 1024

apc_ups:
  id: ups


text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "IP Address"
      web_server:
        sorting_group_id: group_board
    # Read back by tools/sticks3_deploy.py to prove the host it verified is
    # the chip it flashed. Two boards running sibling configs answer the same
    # entity paths, so nothing else distinguishes them.
    mac_address:
      name: "MAC Address"
      web_server:
        sorting_group_id: group_board

sensor:
  - platform: apc_ups
    battery_level:
      name: "UPS Battery Level"
      id: ups_battery
      web_server:
        sorting_group_id: group_ups
    runtime:
      name: "UPS Runtime"
      id: ups_runtime
      web_server:
        sorting_group_id: group_ups
    input_voltage:
      name: "UPS Input Voltage"
      id: ups_input_voltage
      web_server:
        sorting_group_id: group_ups
    battery_voltage:
      name: "UPS Battery Voltage"
      id: ups_battery_voltage
      web_server:
        sorting_group_id: group_ups
    load:
      name: "UPS Load"
      id: ups_load
      web_server:
        sorting_group_id: group_ups
    power:
      name: "UPS Power"
      id: ups_power
      web_server:
        sorting_group_id: group_ups
    nominal_power:
      name: "UPS Nominal Power"
      id: ups_nominal_power
      web_server:
        sorting_group_id: group_ups

binary_sensor:
  - platform: apc_ups
    online:
      name: "UPS Online"
      id: ups_online
      web_server:
        sorting_group_id: group_ups
    charging:
      name: "UPS Charging"
      web_server:
        sorting_group_id: group_ups
    discharging:
      name: "UPS On Battery"
      id: ups_on_battery
      web_server:
        sorting_group_id: group_ups
    low_battery:
      name: "UPS Low Battery"
      id: ups_low_battery
      web_server:
        sorting_group_id: group_ups
    replace_battery:
      name: "UPS Replace Battery"
      web_server:
        sorting_group_id: group_ups
    overload:
      name: "UPS Overload"
      web_server:
        sorting_group_id: group_ups
    shutdown_imminent:
      name: "UPS Shutdown Imminent"
      web_server:
        sorting_group_id: group_ups
    battery_present:
      name: "UPS Battery Present"
      web_server:
        sorting_group_id: group_ups
