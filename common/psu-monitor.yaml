# Everything in the Owon PSU monitor that does not depend on the board:
# the USB host, the CH340 bridge, the owon_psu component and every entity it exposes.
#
# Fonts and the display lambda stay with each board, since they are sized to a
# particular panel.

logger:
  # Normal ops: INFO -- see the note in apc-monitor.yaml.
  level: INFO
  logs:
    i2c.idf: ERROR
    spi_device: ERROR
    display.mipi_spi: WARN
    component: WARN
    sensor: WARN
    binary_sensor: WARN
    text_sensor: WARN
    uptime.sensor: WARN
    wifi_info: WARN
    api: WARN
    web_server: ERROR
    web_server_idf: ERROR
    mdns: WARN
    preferences: WARN
    light: WARN
  # The OTG peripheral owns the PHY, so there is no serial console to log to.
  baud_rate: 0

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      # The IDF USB host ISR is flash-resident with no IRAM option, so a
      # transfer completing during the erase makes its driver assert.
      - lambda: 'id(psu).suspend_usb();'
    on_error:
      - lambda: 'id(psu).resume_usb();'
  - platform: web_server
    on_begin:
      # The IDF USB host ISR is flash-resident with no IRAM option, so a
      # transfer completing during the erase makes its driver assert.
      - lambda: 'id(psu).suspend_usb();'
    on_error:
      - lambda: 'id(psu).resume_usb();'

web_server:
  port: 80
  version: 3
  local: true
  sorting_groups:
    - id: group_psu
      name: "PSU"
      sorting_weight: 10
    - id: group_board
      name: "Board"
      sorting_weight: 20

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

external_components:
  - source:
      type: local
      path: components
    # usb_uart is the ESPHome one plus suspend_usb(); see its VENDOR.md.
    components: [owon_psu, usb_uart]

usb_host:
  max_packet_size: 64

usb_uart:
  - type: CH340
    id: psu_usb
    channels:
      - id: psu_uart
        baud_rate: 115200

owon_psu:
  id: psu
  usb_uart_id: psu_uart
  voltage_cap: psu_voltage_cap
  current_cap: psu_current_cap

number:
  # Bounds on what Home Assistant may set, kept across reboots. Defaults are
  # the PSU's own range: lower them in the UI for the job at hand.
  - platform: template
    name: "PSU Voltage Cap"
    id: psu_voltage_cap
    icon: "mdi:shield-lock-outline"
    entity_category: config
    unit_of_measurement: V
    optimistic: true
    restore_value: true
    initial_value: 60
    min_value: 0
    max_value: 60
    step: 0.1
    web_server:
      sorting_group_id: group_psu
  - platform: template
    name: "PSU Current Cap"
    id: psu_current_cap
    icon: "mdi:shield-lock-outline"
    entity_category: config
    unit_of_measurement: A
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 0
    max_value: 10
    step: 0.01
    web_server:
      sorting_group_id: group_psu
  - platform: owon_psu
    voltage:
      name: "PSU Voltage Setpoint"
      id: psu_voltage_set
      web_server:
        sorting_group_id: group_psu
    current:
      name: "PSU Current Setpoint"
      id: psu_current_set
      web_server:
        sorting_group_id: group_psu
    voltage_limit:
      name: "PSU OVP Limit"
      entity_category: config
      web_server:
        sorting_group_id: group_psu
    current_limit:
      name: "PSU OCP Limit"
      entity_category: config
      web_server:
        sorting_group_id: group_psu

switch:
  - platform: owon_psu
    output:
      name: "PSU Output"
      id: psu_output
      web_server:
        sorting_group_id: group_psu

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "IP Address"
      web_server:
        sorting_group_id: group_board
    # Read back by tools/sticks3_deploy.py; see qx-monitor.yaml.
    mac_address:
      name: "MAC Address"
      web_server:
        sorting_group_id: group_board
  - platform: owon_psu
    model:
      name: "PSU Model"
      web_server:
        sorting_group_id: group_psu
    serial_number:
      name: "PSU Serial Number"
      web_server:
        sorting_group_id: group_psu
    firmware:
      name: "PSU Firmware"
      web_server:
        sorting_group_id: group_psu
    mode:
      name: "PSU Mode"
      id: psu_mode
      web_server:
        sorting_group_id: group_psu

sensor:
  - platform: owon_psu
    voltage:
      name: "PSU Voltage"
      id: psu_voltage
      web_server:
        sorting_group_id: group_psu
    current:
      name: "PSU Current"
      id: psu_current
      web_server:
        sorting_group_id: group_psu
    power:
      name: "PSU Power"
      id: psu_power
      web_server:
        sorting_group_id: group_psu

binary_sensor:
  - platform: owon_psu
    ovp:
      name: "PSU OVP Tripped"
      id: psu_ovp
      web_server:
        sorting_group_id: group_psu
    ocp:
      name: "PSU OCP Tripped"
      id: psu_ocp
      web_server:
        sorting_group_id: group_psu
    otp:
      name: "PSU OTP Tripped"
      id: psu_otp
      web_server:
        sorting_group_id: group_psu
    connected:
      name: "PSU Connected"
      id: psu_connected
      web_server:
        sorting_group_id: group_psu
