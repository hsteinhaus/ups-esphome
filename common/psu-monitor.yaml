# Everything in the Owon PSU monitor that does not depend on the board: the
# USB host and hub, the PSU's CH340 bridge, the DGE1060 signal generator, and
# every entity the owon_psu and owon_dge components expose.
#
# Fonts and the display lambda stay with each board, since they are sized to a
# particular panel.

logger:
  # Normal ops: INFO -- see the note in apc-monitor.yaml.
  level: INFO
  logs:
    i2c.idf: ERROR
    spi_device: ERROR
    display.mipi_spi: WARN
    component: WARN
    sensor: WARN
    binary_sensor: WARN
    text_sensor: WARN
    uptime.sensor: WARN
    wifi_info: WARN
    api: WARN
    web_server: ERROR
    web_server_idf: ERROR
    mdns: WARN
    preferences: WARN
    light: WARN
  # The OTG peripheral owns the PHY, so there is no serial console to log to.
  baud_rate: 0

api:
  # Mainly driven from its web UI: no HA client is normal, not a fault.
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password
    on_begin:
      # The IDF USB host ISR is flash-resident with no IRAM option, so a
      # transfer completing during the erase makes its driver assert.
      - lambda: 'id(psu).suspend_usb(); id(dge).suspend_usb();'
    on_error:
      - lambda: 'id(psu).resume_usb(); id(dge).resume_usb();'
  - platform: web_server
    on_begin:
      # The IDF USB host ISR is flash-resident with no IRAM option, so a
      # transfer completing during the erase makes its driver assert.
      - lambda: 'id(psu).suspend_usb(); id(dge).suspend_usb();'
    on_error:
      - lambda: 'id(psu).resume_usb(); id(dge).resume_usb();'

web_server:
  port: 80
  version: 3
  local: true
  sorting_groups:
    - id: group_psu
      name: "PSU"
      sorting_weight: 10
    - id: group_caps
      name: "Caps"
      sorting_weight: 15
    - id: group_signal
      name: "Signal"
      sorting_weight: 16
    - id: group_modulation
      name: "Modulation"
      sorting_weight: 17
    - id: group_sweep
      name: "Sweep"
      sorting_weight: 18
    - id: group_burst
      name: "Burst"
      sorting_weight: 19
    - id: group_board
      name: "Board"
      sorting_weight: 20

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source:
      type: local
      path: components
    # usb_uart is the ESPHome one plus suspend_usb() and more; see its VENDOR.md.
    components: [owon_psu, owon_dge, usb_uart, agent_doc]

# The HIL guide for agents, served by the firmware it describes.
agent_doc:
  file: docs/HIL-AGENT.md

usb_host:
  # A hub fans the port out to the PSU and the signal generator. That takes
  # every one of the S3's 8 host channels; see usb_uart/VENDOR.md.
  enable_hubs: true
  max_packet_size: 64

usb_uart:
  - type: CH340
    id: psu_usb
    channels:
      - id: psu_uart
        baud_rate: 115200

owon_psu:
  id: psu
  usb_uart_id: psu_uart
  voltage_cap: psu_voltage_cap
  current_cap: psu_current_cap

owon_dge:
  id: dge

number:
  # Bounds on what Home Assistant may set, kept across reboots. Defaults are
  # the PSU's own range: lower them in the UI for the job at hand.
  - platform: template
    name: "PSU Voltage Cap"
    id: psu_voltage_cap
    icon: "mdi:shield-lock-outline"
    entity_category: config
    unit_of_measurement: V
    optimistic: true
    restore_value: true
    initial_value: 60
    min_value: 0
    max_value: 60
    step: 0.1
    web_server:
      sorting_group_id: group_caps
  - platform: template
    name: "PSU Current Cap"
    id: psu_current_cap
    icon: "mdi:shield-lock-outline"
    entity_category: config
    unit_of_measurement: A
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 0
    max_value: 10
    step: 0.01
    web_server:
      sorting_group_id: group_caps
  - platform: owon_psu
    voltage:
      name: "PSU Voltage Setpoint"
      id: psu_voltage_set
      web_server:
        sorting_group_id: group_psu
    current:
      name: "PSU Current Setpoint"
      id: psu_current_set
      web_server:
        sorting_group_id: group_psu
    voltage_limit:
      name: "PSU OVP Limit"
      entity_category: config
      web_server:
        sorting_group_id: group_psu
    current_limit:
      name: "PSU OCP Limit"
      entity_category: config
      web_server:
        sorting_group_id: group_psu
  - platform: owon_dge
    load:
      name: "DGE Load"
      entity_category: config
      web_server:
        sorting_group_id: group_signal
    frequency:
      name: "DGE Frequency"
      web_server:
        sorting_group_id: group_signal
    amplitude:
      name: "DGE Amplitude"
      web_server:
        sorting_group_id: group_signal
    offset:
      name: "DGE Offset"
      web_server:
        sorting_group_id: group_signal
    phase:
      name: "DGE Phase"
      web_server:
        sorting_group_id: group_signal
    ramp_symmetry:
      name: "DGE Ramp Symmetry"
      web_server:
        sorting_group_id: group_signal
    pulse_duty:
      name: "DGE Pulse Duty"
      web_server:
        sorting_group_id: group_signal
    pulse_width:
      name: "DGE Pulse Width"
      web_server:
        sorting_group_id: group_signal
    pulse_lead:
      name: "DGE Pulse Leading Edge"
      web_server:
        sorting_group_id: group_signal
    pulse_trail:
      name: "DGE Pulse Trailing Edge"
      web_server:
        sorting_group_id: group_signal
    am_depth:
      name: "DGE AM Depth"
      web_server:
        sorting_group_id: group_modulation
    am_frequency:
      name: "DGE AM Frequency"
      web_server:
        sorting_group_id: group_modulation
    fm_deviation:
      name: "DGE FM Deviation"
      web_server:
        sorting_group_id: group_modulation
    fm_frequency:
      name: "DGE FM Frequency"
      web_server:
        sorting_group_id: group_modulation
    fsk_frequency:
      name: "DGE FSK Hop Frequency"
      web_server:
        sorting_group_id: group_modulation
    fsk_rate:
      name: "DGE FSK Rate"
      web_server:
        sorting_group_id: group_modulation
    sweep_time:
      name: "DGE Sweep Time"
      web_server:
        sorting_group_id: group_sweep
    sweep_start:
      name: "DGE Sweep Start"
      web_server:
        sorting_group_id: group_sweep
    sweep_stop:
      name: "DGE Sweep Stop"
      web_server:
        sorting_group_id: group_sweep
    burst_cycles:
      name: "DGE Burst Cycles"
      web_server:
        sorting_group_id: group_burst
    burst_period:
      name: "DGE Burst Period"
      web_server:
        sorting_group_id: group_burst

select:
