    shape:
      name: "DGE Waveform"
      web_server:
        sorting_group_id: group_signal
    modulation:
      name: "DGE Modulation"
      web_server:
        sorting_group_id: group_modulation
    am_source:
      name: "DGE AM Source"
      web_server:
        sorting_group_id: group_modulation
    am_shape:
      name: "DGE AM Shape"
      web_server:
        sorting_group_id: group_modulation
    fm_source:
      name: "DGE FM Source"
      web_server:
        sorting_group_id: group_modulation
    fm_shape:
      name: "DGE FM Shape"
      web_server:
        sorting_group_id: group_modulation
    fsk_source:
      name: "DGE FSK Source"
      web_server:
        sorting_group_id: group_modulation
    sweep_spacing:
      name: "DGE Sweep Spacing"
      web_server:
        sorting_group_id: group_sweep
    sweep_source:
      name: "DGE Sweep Source"
      web_server:
        sorting_group_id: group_sweep
    burst_mode:
      name: "DGE Burst Mode"
      web_server:
        sorting_group_id: group_burst
    burst_source:
      name: "DGE Burst Source"
      web_server:
        sorting_group_id: group_burst
    burst_gate_polarity:
      name: "DGE Burst Gate Polarity"
      web_server:
        sorting_group_id: group_burst

button:
  # Reboots without touching either instrument; also how boot-time USB
  # attach is tested.
  - platform: restart
    name: "Restart"
    entity_category: config
    web_server:
      sorting_group_id: group_board

switch:
  - platform: owon_psu
    output:
      name: "PSU Output"
      id: psu_output
      web_server:
        sorting_group_id: group_psu
  - platform: owon_dge
    output:
      name: "DGE Output"
      web_server:
        sorting_group_id: group_signal
    load_high_z:
      name: "DGE Load High-Z"
      entity_category: config
      web_server:
        sorting_group_id: group_signal
    sweep:
      name: "DGE Sweep"
      web_server:
        sorting_group_id: group_sweep
    burst:
      name: "DGE Burst"
      web_server:
        sorting_group_id: group_burst

text_sensor:
  # Points at the agent_doc guide; the local web UI has no way to add a link.
  - platform: template
    name: "Agent Guide"
    icon: "mdi:robot-outline"
    entity_category: diagnostic
    lambda: 'return {"/agent.md"};'
    update_interval: 1h
    web_server:
      sorting_group_id: group_board
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "IP Address"
      web_server:
        sorting_group_id: group_board
    # Read back by tools/sticks3_deploy.py; see qx-monitor.yaml.
    mac_address:
      name: "MAC Address"
      web_server:
        sorting_group_id: group_board
  - platform: owon_psu
    model:
      name: "PSU Model"
      web_server:
        sorting_group_id: group_psu
    serial_number:
      name: "PSU Serial Number"
      web_server:
        sorting_group_id: group_psu
    firmware:
      name: "PSU Firmware"
      web_server:
        sorting_group_id: group_psu
    mode:
      name: "PSU Mode"
      id: psu_mode
      web_server:
        sorting_group_id: group_psu
  - platform: owon_dge
    model:
      name: "DGE Model"
      web_server:
        sorting_group_id: group_signal
    serial_number:
      name: "DGE Serial Number"
      web_server:
        sorting_group_id: group_signal
    firmware:
