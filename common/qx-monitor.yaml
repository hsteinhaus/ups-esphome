# Everything in the Megatec/Q* UPS monitor that does not depend on the board:
# the USB host, the qx_ups component and every entity it exposes.
#
# Fonts and the display lambda stay with each board, since they are sized to a
# particular panel.

logger:
  level: VERBOSE
  logs:
    i2c.idf: ERROR
    spi_device: ERROR
    display.mipi_spi: WARN
    component: WARN
    sensor: WARN
    binary_sensor: WARN
    text_sensor: WARN
    uptime.sensor: WARN
    wifi_info: WARN
    api: WARN
    web_server: ERROR
    web_server_idf: ERROR
    mdns: WARN
    preferences: WARN
    wifi: INFO
    light: WARN
    # VERBOSE here prints every command and its reply with the round-trip time,
    # which is how the dialect gets confirmed against a device we cannot probe.
    qx_ups: VERBOSE
  # The OTG peripheral owns the PHY, so there is no serial console to log to.
  baud_rate: 0

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server

web_server:
  port: 80
  version: 3
  local: true
  sorting_groups:
    - id: group_ups
      name: "UPS"
      sorting_weight: 10
    - id: group_board
      name: "Board"
      sorting_weight: 20

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

external_components:
  - source:
      type: local
      path: components
    components: [qx_ups]

usb_host:
  # Unlike the APC, nothing here reads a HID report descriptor: the bridge
  # moves 8-byte reports and the largest transfer is one of those. 64 is the
  # default and is already eight times what this device needs.
  max_packet_size: 64

qx_ups:
  id: ups
  # Megatec reports load only as a percentage, so watts are load x this. The
  # board config sets it from the plate; see the comment there.
  nominal_power: ${ups_nominal_power}

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "IP Address"
      web_server:
        sorting_group_id: group_board
    # Read back by tools/sticks3_deploy.py to prove the host it verified is
    # the chip it flashed. Two boards running sibling configs answer the same
    # entity paths, so nothing else distinguishes them.
    mac_address:
      name: "MAC Address"
      web_server:
        sorting_group_id: group_board
  - platform: qx_ups
    manufacturer:
      name: "UPS Manufacturer"
      id: ups_manufacturer
      web_server:
        sorting_group_id: group_ups
    model:
      name: "UPS Model"
      id: ups_model
      web_server:
        sorting_group_id: group_ups
    firmware:
      name: "UPS Firmware"
      web_server:
        sorting_group_id: group_ups

sensor:
  - platform: qx_ups
    input_voltage:
      name: "UPS Input Voltage"
      id: ups_input_voltage
      web_server:
        sorting_group_id: group_ups
    input_fault_voltage:
      name: "UPS Input Fault Voltage"
      web_server:
        sorting_group_id: group_ups
    output_voltage:
      name: "UPS Output Voltage"
      id: ups_output_voltage
      web_server:
        sorting_group_id: group_ups
    load:
      name: "UPS Load"
      id: ups_load
      web_server:
        sorting_group_id: group_ups
    input_frequency:
      name: "UPS Input Frequency"
      id: ups_input_frequency
      web_server:
        sorting_group_id: group_ups
    battery_voltage:
      name: "UPS Battery Voltage"
      id: ups_battery_voltage
      web_server:
        sorting_group_id: group_ups
    temperature:
      name: "UPS Temperature"
      id: ups_temperature
      web_server:
        sorting_group_id: group_ups
    power:
      name: "UPS Power"
      id: ups_power
      web_server:
        sorting_group_id: group_ups
    battery_level:
      name: "UPS Battery Level"
      id: ups_battery
      web_server:
        sorting_group_id: group_ups
    rated_voltage:
      name: "UPS Rated Voltage"
      web_server:
        sorting_group_id: group_ups
    rated_current:
      name: "UPS Rated Current"
      web_server:
        sorting_group_id: group_ups
    rated_battery_voltage:
      name: "UPS Rated Battery Voltage"
      web_server:
        sorting_group_id: group_ups

binary_sensor:
  - platform: qx_ups
    online:
      name: "UPS Online"
      id: ups_online
      web_server:
        sorting_group_id: group_ups
    on_battery:
      name: "UPS On Battery"
      id: ups_on_battery
      web_server:
        sorting_group_id: group_ups
    low_battery:
      name: "UPS Low Battery"
      id: ups_low_battery
      web_server:
        sorting_group_id: group_ups
    boost_buck:
      name: "UPS Voltage Regulating"
      id: ups_boost_buck
      web_server:
        sorting_group_id: group_ups
    ups_failed:
      name: "UPS Failed"
      web_server:
        sorting_group_id: group_ups
    test_in_progress:
      name: "UPS Test In Progress"
      web_server:
        sorting_group_id: group_ups
    shutdown_active:
      name: "UPS Shutdown Active"
      web_server:
        sorting_group_id: group_ups
    beeper_on:
      name: "UPS Beeper"
      web_server:
        sorting_group_id: group_ups
