# M5Stack CoreS3 hardware bring-up: power rails, IO expander, display, touch.
# Pin map per https://docs.m5stack.com/en/core/CoreS3
# AW9523B bit assignments cross-checked against M5Unified Power_Class.cpp.

substitutions:
  # Consecutive boots that failed to reach boost_settle_time with VBUS asserted
  # before the restore is abandoned.
  boost_boot_limit: "3"
  boost_settle_time: 30s

esphome:
  on_boot:
    # Between axp2101 setup (DATA, 600) and display setup, so the panel and
    # touch rails are live before either is initialised.
    - priority: 500
      then:
        - output.turn_on: rail_aldo1
        - output.turn_on: rail_aldo2
        - output.turn_on: rail_bldo1
        - output.turn_on: rail_bldo2
    - priority: -100
      then:
        # Runs after every setup, so it is the last word on what the switch
        # reports. A restore publishes its own state after the action has run,
        # which would otherwise claim 5V that the interlock had just refused.
        - switch.template.publish:
            id: usb_host_power
            state: !lambda "return id(vbus_boost_en).state && id(usb_otg_en).state;"
        # A boot that survives this long was not a brownout, so the attempt
        # counter starts again from zero and a manual turn-on stops counting.
        - delay: $boost_settle_time
        - lambda: |-
            id(boost_boot_attempts) = 0;
            id(boot_settled) = true;

globals:
  # Survives the reset, which is the whole point: a brownout loop is only
  # visible by comparing this boot against the ones before it.
  - id: boost_boot_attempts
    type: uint8_t
    restore_value: true
    initial_value: "0"
  - id: boot_settled
    type: bool
    restore_value: false
    initial_value: "false"

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

external_components:
  - source: github://m5stack/esphome-yaml/components
    components: [axp2101, aw9523b]
  # Relative to the main config, not to this package.
  - source:
      type: local
      path: components
    components: [axp2101_vbus]

i2c:
  - id: bsp_bus
    sda: GPIO12
    scl: GPIO11

spi:
  - id: lcd_bus
    clk_pin: GPIO36
    mosi_pin: GPIO37

axp2101:
  id: pmu
  i2c_id: bsp_bus

aw9523b:
  id: expander
  i2c_id: bsp_bus
  # P0_5 (USB_OTG_EN) must actively drive high, so P0 cannot be open-drain.
  p0_drive_mode: PUSH_PULL

output:
  - platform: axp2101
    type: range
    channel: DLDO1
    id: lcd_backlight_output
    min_voltage: 2600
    max_voltage: 3300
  - platform: axp2101
    channel: ALDO1
    id: rail_aldo1
    voltage: 1800
  - platform: axp2101
    channel: ALDO2
    id: rail_aldo2
    voltage: 3300
  - platform: axp2101
    channel: BLDO1
    id: rail_bldo1
    voltage: 2800
  - platform: axp2101
    channel: BLDO2
    id: rail_bldo2
    voltage: 1500

light:
  - platform: monochromatic
    id: lcd_backlight
    name: "Backlight"
    output: lcd_backlight_output
    web_server:
      sorting_group_id: group_board
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms

display:
  - platform: mipi_spi
    id: lcd
    model: M5CORE
    spi_id: lcd_bus
    dc_pin: GPIO35
    cs_pin:
      number: GPIO3
      ignore_strapping_warning: true
    reset_pin:
      aw9523b_id: expander
      number: 9 # P1_1
    data_rate: 40MHz
    invert_colors: true

touchscreen:
  - platform: ft63x6
    id: touch
    i2c_id: bsp_bus
    reset_pin:
      aw9523b_id: expander
      number: 0 # P0_0
    calibration:
      x_min: 0
      x_max: 320
      y_min: 0
      y_max: 240

sensor:
  - platform: axp2101
    id: pmu_sensor
    battery_level:
      id: battery_level
      name: "Battery Level"
      web_server:
        sorting_group_id: group_board
    battery_voltage:
      id: battery_voltage
      name: "Battery Voltage"
      web_server:
        sorting_group_id: group_board
    axp_temperature:
      id: pmu_temperature
      name: "PMU Temperature"
      web_server:
        sorting_group_id: group_board
    battery_charging:
      id: battery_charging
      name: "Battery Charging"
      web_server:
        sorting_group_id: group_board

binary_sensor:
  # Also pulls in the binary_sensor component, which the axp2101 above emits
  # code for (battery_charging) without declaring in AUTO_LOAD. Without a
  # binary_sensor platform somewhere, the build fails on a missing
  # binary_sensor.h -- see README, upstream fix pending.
  - platform: status
    id: device_status
    name: "Status"
    web_server:
      sorting_group_id: group_board

  # Externally supplied 5V on the USB-C port. The PMU cannot see VBUS the board
  # drives itself, so this reads as the supply from outside and nothing else --
  # which is exactly what the boost must not fight.
  - platform: axp2101_vbus
    id: vbus_external
    i2c_id: bsp_bus
    pmu_init: false
    internal: true
    update_interval: 10s

# USB-C host power. Turning this on makes the CoreS3 SOURCE 5V on its USB-C
# port, so the board can no longer be powered through it -- see README.
switch:
  - platform: gpio
    id: vbus_boost_en
    pin:
      aw9523b_id: expander
      number: 15 # P1_7, SY7088 BOOST_EN
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: bus_out_en
    pin:
      aw9523b_id: expander
      number: 1 # P0_1, BUS_OUT_EN
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: usb_otg_en
    pin:
      aw9523b_id: expander
      number: 5 # P0_5, USB_OTG_EN
    internal: true
    restore_mode: ALWAYS_OFF
  - platform: template
    id: usb_host_power
    name: "USB Host 5V"
    # Not optimistic: an optimistic switch publishes the requested state after
    # the action, overwriting a refusal and reporting 5V that is not there.
    # Every path below publishes what actually happened instead.
    optimistic: false
    web_server:
      sorting_group_id: group_board
    # Persists across reboots: on the UPS the board is unreachable, so a reboot
    # or OTA must bring VBUS back by itself rather than wait for a manual
    # toggle. Restoring re-runs turn_on_action, and the gpio switches above are
    # declared first, so their ALWAYS_OFF writes land before this re-asserts.
    restore_mode: RESTORE_DEFAULT_OFF
    # BUS_OUT_EN low ties the boost output to the BUS input path, so VBUS never
    # rises from USB_OTG_EN alone -- measured 0V with only boost+OTG set, 5.007V
    # once BUS_OUT_EN joined them. M5Unified's setUsbOutput omits it because its
    # board init raises BUS_OUT_EN separately.
    #
    # Boost before switches on, switches off before boost: a half-applied
    # sequence never reports the output live while the converter is stopped.
    #
    # Asserting the boost on a flat battery browns the rail out, and the board
    # reboots into the same restore: a loop it cannot leave, because sourcing
    # VBUS also blocks charging on the same port. Counting boots that never
    # settle breaks it whatever the cause -- flat cell, host feeding the port,
    # or a short on the far end.
    turn_on_action:
      - if:
          # Sourcing into a port that is already fed drives the boost against
          # another supply. Batteryless, that feed is also the board's own
          # power, so refusing is the only safe answer.
          condition:
            lambda: "return id(vbus_external)->vbus_present();"
          then:
            - logger.log:
                level: WARN
                format: "USB Host 5V refused: the port is already supplied from outside"
            - switch.template.publish:
                id: usb_host_power
                state: false
          else:
            - if:
                condition:
                  lambda: "return !id(boot_settled) && id(boost_boot_attempts) >= $boost_boot_limit;"
                then:
                  - logger.log:
                      level: WARN
                      format: "USB Host 5V restore abandoned after %u boots that never settled"
                      args: ["id(boost_boot_attempts)"]
                  - switch.template.publish:
                      id: usb_host_power
                      state: false
                else:
                  - lambda: "if (!id(boot_settled)) id(boost_boot_attempts)++;"
                  - switch.turn_on: vbus_boost_en
                  - delay: 10ms
                  - switch.turn_on: bus_out_en
                  - switch.turn_on: usb_otg_en
                  - switch.template.publish:
                      id: usb_host_power
                      state: true
    turn_off_action:
      - switch.turn_off: usb_otg_en
      - switch.turn_off: bus_out_en
      - delay: 10ms
      - switch.turn_off: vbus_boost_en
      - switch.template.publish:
          id: usb_host_power
          state: false
