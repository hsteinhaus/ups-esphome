# APC Back-UPS BX950MI monitor.
#
# The CoreS3 sources VBUS for the UPS, so it cannot be powered through its own
# USB-C port -- see README. USB serial is unavailable once usb_host claims the
# OTG PHY; updates are OTA.

substitutions:
  name: apc-ups

esphome:
  name: ${name}
  friendly_name: APC UPS

packages:
  board: !include boards/m5stack-cores3.yaml
  monitor: !include common/ups-monitor.yaml

font:
  - file: "gfonts://Roboto"
    id: font_body
    size: 18
  - file: "gfonts://Roboto"
    id: font_title
    size: 26
  - file: "gfonts://Roboto"
    id: font_small
    size: 14

display:
  - id: !extend lcd
    update_interval: 1s
    lambda: |-
      // Upper two thirds are the UPS, the strip below the rule is this board.
      // Keeping them apart stops the CoreS3's own battery being read as the
      // UPS's at a glance.
      const int FOOTER_Y = 186;
      it.fill(Color::BLACK);

      it.filled_rectangle(0, 0, it.get_width(), 30, Color(0x00, 0x2A, 0x42));
      it.print(8, 2, id(font_title), Color(0x00, 0xC8, 0xFF), "APC Back-UPS");

      if (!id(usb_host_power).state) {
        it.print(10, 52, id(font_title), Color(0xFF, 0x60, 0x60), "VBUS OFF");
        it.print(10, 92, id(font_body), Color(0xFF, 0xD0, 0x40), "UPS unpowered - enable");
        it.print(10, 116, id(font_body), Color(0xFF, 0xD0, 0x40), "'USB Host 5V'");
      } else if (!id(ups_battery).has_state()) {
        it.print(10, 52, id(font_title), Color(0xFF, 0xD0, 0x40), "Waiting for UPS");
      } else {
        const bool on_battery = id(ups_on_battery).state;
        const bool low = id(ups_low_battery).state;
        const auto status_color = low    ? Color(0xFF, 0x40, 0x40)
                                  : on_battery ? Color(0xFF, 0xD0, 0x40)
                                               : Color(0x40, 0xFF, 0x40);
        it.printf(10, 40, id(font_title), status_color, "%s",
                  low ? "LOW BATTERY" : (on_battery ? "ON BATTERY" : "ONLINE"));

        it.printf(10, 80, id(font_body), Color::WHITE, "Charge   %.0f %%", id(ups_battery).state);
        if (id(ups_power).has_state()) {
          it.printf(10, 104, id(font_body), Color::WHITE, "Load     %.0f %%  (%.0f W)",
                    id(ups_load).state, id(ups_power).state);
        } else {
          it.printf(10, 104, id(font_body), Color::WHITE, "Load     %.0f %%", id(ups_load).state);
        }
        it.printf(10, 128, id(font_body), Color::WHITE, "Runtime  %.0f min", id(ups_runtime).state / 60.0f);
        it.printf(170, 80, id(font_body), Color::WHITE, "In  %.0f V", id(ups_input_voltage).state);
        it.printf(170, 104, id(font_body), Color::WHITE, "Bat %.1f V", id(ups_battery_voltage).state);
      }

      it.line(0, FOOTER_Y, it.get_width(), FOOTER_Y, Color(0x40, 0x40, 0x40));
      it.print(8, FOOTER_Y + 6, id(font_small), Color(0x60, 0x60, 0x60), "CoreS3");
      it.printf(8, FOOTER_Y + 26, id(font_small), Color(0xA0, 0xA0, 0xA0), "Bat %.0f%%",
                id(battery_level).has_state() ? id(battery_level).state : 0.0f);
      it.printf(90, FOOTER_Y + 26, id(font_small), Color(0xA0, 0xA0, 0xA0), "%s",
                id(wifi_ip).state.empty() ? "no wifi" : id(wifi_ip).state.c_str());
