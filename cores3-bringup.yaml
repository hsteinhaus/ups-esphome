# Stage 1: prove the CoreS3 hardware works before any UPS code exists.
# Screen shows link state, PMU telemetry and the last touch point.

substitutions:
  name: cores3-bringup

esphome:
  name: ${name}
  friendly_name: CoreS3 Bring-up

packages:
  board: !include boards/m5stack-cores3.yaml

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:

captive_portal:

font:
  - file: "gfonts://Roboto"
    id: font_body
    size: 18
  - file: "gfonts://Roboto"
    id: font_title
    size: 26

globals:
  - id: touch_x
    type: int
    initial_value: "-1"
  - id: touch_y
    type: int
    initial_value: "-1"

touchscreen:
  - id: !extend touch
    on_touch:
      - lambda: |-
          id(touch_x) = touch.x;
          id(touch_y) = touch.y;
      - component.update: lcd

display:
  - id: !extend lcd
    update_interval: 1s
    lambda: |-
      it.fill(Color::BLACK);
      it.print(10, 8, id(font_title), Color(0x00, 0xC8, 0xFF), "CoreS3 Bring-up");

      it.printf(10, 48, id(font_body), Color::WHITE, "WiFi: %s",
                id(wifi_ip).state.empty() ? "connecting..." : id(wifi_ip).state.c_str());
      it.printf(10, 74, id(font_body), Color::WHITE, "API:  %s",
                esphome::api::global_api_server->is_connected() ? "connected" : "waiting");

      if (id(battery_level).has_state()) {
        it.printf(10, 108, id(font_body), Color::WHITE, "Battery: %.0f %%", id(battery_level).state);
      }

      if (id(touch_x) >= 0) {
        it.printf(10, 142, id(font_body), Color(0xFF, 0xD0, 0x40), "Touch: %d, %d",
                  id(touch_x), id(touch_y));
        it.filled_circle(id(touch_x), id(touch_y), 6, Color(0xFF, 0xD0, 0x40));
      } else {
        it.print(10, 142, id(font_body), Color(0x80, 0x80, 0x80), "Touch: tap the screen");
      }

      it.printf(10, 210, id(font_body), Color(0x80, 0x80, 0x80), "Uptime: %.0f s", id(uptime_s).state);

sensor:
  - platform: uptime
    id: uptime_s
    name: "Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip
      name: "IP Address"
